<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="./logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="منصة من نور إلى نور - منصة رقمية تجمعك بمعلّم قرآن حقيقي، أينما كنت. تعلم القرآن الكريم عن بُعد مع معلمين حقيقيين" />
    <meta property="og:title" content="من نور إلى نور - منصة التعليم القرآني عن بُعد" />
    <meta property="og:description" content="منصة رقمية تجمعك بمعلّم قرآن حقيقي، أينما كنت" />
    <meta property="og:image" content="./logo.jpg" />
    <meta property="og:type" content="website" />
    <title>من نور إلى نور - منصة التعليم القرآني عن بُعد</title>
    <script>
      // Apply the saved theme and language before first paint to avoid flashes
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          var isDark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', isDark)
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'

          var lang = localStorage.getItem('language')
          if (lang === 'en' || lang === 'fr' || lang === 'ar') {
            document.documentElement.lang = lang
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
